name: Install brand logos
on:
  push:
    branches: [main]
    paths: ['brand_ui.js', '.github/workflows/install-brand-logos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect logos and install interface
        run: |
          set -euo pipefail
          node --check brand_ui.js
          python - <<'PY'
          import base64, concurrent.futures, html, json, re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          sites = {
              'Amouage':'https://amouage.com/',
              'Clive Christian':'https://us.clivechristian.com/',
              'Creed':'https://creedfragrance.com/',
              'Dior':'https://www.dior.com/',
              'Emporio Armani':'https://www.armani.com/',
              'Essential Parfums':'https://www.essentialparfums.com/en/',
              'Ex Nihilo':'https://www.ex-nihilo-paris.com/',
              'Initio':'https://initioparfums.com/',
              'Jean Paul Gaultier':'https://www.jeanpaulgaultier.com/',
              'Kilian':'https://www.bykilian.com/',
              'Louis Vuitton':'https://www.louisvuitton.com/',
              'Maison Crivelli':'https://maisoncrivelli.com/',
              'Maison Margiela':'https://www.maisonmargiela.com/',
              'Mancera':'https://www.manceraparfums.com/en/',
              'Parfums de Marly':'https://parfums-de-marly.com/',
              'Tom Ford':'https://www.tomfordbeauty.com/',
              'Viktor & Rolf':'https://www.viktor-rolf.com/',
              'Xerjoff':'https://www.xerjoff.com/'
          }
          def get(url):
              if not url.startswith('https://'):
                  raise ValueError('HTTPS required')
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:
                  return r.read(2500000),r.headers.get_content_type(),r.url
          class Images(HTMLParser):
              def __init__(self):
                  super().__init__();self.items=[]
              def handle_starttag(self,tag,attrs):
                  if tag!='img':return
                  a=dict(attrs);src=a.get('src') or a.get('data-src') or ''
                  label=' '.join([src,a.get('alt',''),a.get('class',''),a.get('id','')]).lower()
                  if 'logo' in label and src and not src.startswith('data:') and not any(w in label for w in ['payment','visa','paypal','klarna','footer-payment']):
                      self.items.append((src,label))
          def collect(pair):
              brand,site=pair
              try:
                  raw,_,base=get(site);parser=Images();parser.feed(raw.decode('utf-8','replace'))
                  candidates=sorted(parser.items,key=lambda p: ('header' not in p[1], 'footer' in p[1]))
                  for src,label in candidates[:6]:
                      if brand=='Emporio Armani' and 'emporio' not in label:continue
                      try:
                          url=urljoin(base,html.unescape(src));blob,mime,_=get(url)
                          if len(blob)<100 or len(blob)>500000:continue
                          if b'<svg' in blob[:1000]:mime='image/svg+xml'
                          if mime not in ('image/svg+xml','image/png','image/jpeg','image/webp'):continue
                          return brand,{'data':'data:'+mime+';base64,'+base64.b64encode(blob).decode(),'source':url,'page':site,'white':'white' in label},None
                      except Exception:continue
                  return brand,None,'No suitable logo image found; text fallback'
              except Exception as e:return brand,None,type(e).__name__+': text fallback'
          logos={};report=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for brand,asset,error in pool.map(collect,sites.items()):
                  if asset:logos[brand]=asset
                  report.append({'brand':brand,'page':sites[brand],'source':asset['source'] if asset else None,'status':'downloaded candidate; visual review required' if asset else error})
          assert logos,'No logos collected; refusing interface installation'
          Path('brand_assets.json').write_text(json.dumps(logos,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('brand_logo_sources.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          page=Path('web_catalog.html');text=page.read_text(encoding='utf-8')
          start='<!-- n59-brand-logos:start -->';end='<!-- n59-brand-logos:end -->'
          if start in text:
              a=text.index(start);b=text.index(end,a)+len(end);text=text[:a]+text[b:]
          js=Path('brand_ui.js').read_text(encoding='utf-8')
          assert '</script' not in js.lower() and '</body>' in text
          payload=json.dumps(logos,ensure_ascii=False).replace('<','\\u003c')
          text=text.replace('</body>',start+'<script>window.n59BrandLogos='+payload+';\n'+js+'</script>'+end+'</body>',1)
          page.write_text(text,encoding='utf-8')
          print('Downloaded logos:',len(logos),'of',len(sites))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web_catalog.html brand_assets.json brand_logo_sources.json
          git diff --cached --quiet || git commit -m 'feat: install brand logos and dark gold picker'
          git push origin HEAD:main
