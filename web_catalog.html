<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOTA 59 — ароматы</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:light;font-family:Arial,sans-serif;color:#302c30;background:#f7f4ef;--accent:#68465e}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a07c94;outline-offset:3px}.wrap{max-width:900px;margin:auto;padding:24px 16px 40px}header{border-bottom:1px solid #ded6ce;padding-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font:27px Georgia,serif;letter-spacing:3px}.label{font-size:10px;letter-spacing:2px;color:#776b72}.intro{margin:24px 0 20px}h1{font:32px/1.15 Georgia,serif;margin:8px 0}.intro p{font-size:13px;color:#766e70;line-height:1.6;margin:10px 0}.filters{display:grid;grid-template-columns:1fr;gap:8px}input,select{width:100%;min-width:0;background:#fffdf9;border:1px solid #ded6ce;border-radius:10px;padding:13px;color:#302c30;font-size:16px}#status{color:#766e70;font-size:12px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-width:0;background:#fffdf9;border:1px solid #e7dfd7;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.visual{height:150px;background:#eee8df;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}.visual img{width:100%;height:100%;object-fit:contain}.placeholder{font:21px/1.4 Georgia,serif;color:#81716e;overflow-wrap:anywhere}.info{padding:13px;display:flex;flex-direction:column;flex:1}.brand{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#776b72;line-height:1.5;margin:0 0 6px}h2{font:18px/1.3 Georgia,serif;margin:0 0 12px;overflow-wrap:anywhere}.price{font-size:14px;margin:auto 0 12px}.more{background:transparent;color:var(--accent);border:1px solid #d5c7ce;border-radius:8px;min-height:42px;width:100%;font-size:12px}dialog{background:#fffdf9;color:#302c30;border:0;border-radius:20px;padding:0;width:calc(100% - 24px);max-width:540px;max-height:88dvh;overflow:auto}dialog::backdrop{background:#29212899}.detail{padding:20px}.close{display:block;margin:0 0 16px auto;background:#f0eae4;border:0;border-radius:8px;padding:11px 15px;color:#493c46}dialog .visual{height:230px;border-radius:12px;margin-bottom:20px}dialog h2{font-size:29px}.volumes{display:flex;gap:10px;margin:20px 0 14px}.volumes button{flex:1;border:1px solid #d5c7ce;background:transparent;border-radius:9px;padding:13px;color:#493c46}.volumes button[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}#chosen{font-size:24px;margin:12px 0}.copy{white-space:pre-wrap;font-size:14px;line-height:1.75;color:#554c50}.order{display:block;background:var(--accent);color:white;text-decoration:none;text-align:center;padding:16px;border-radius:10px;margin-top:24px}.hint{font-size:12px;color:#766e70;line-height:1.5}body.modal{overflow:hidden}@media(min-width:650px){.filters{grid-template-columns:2fr 1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.visual{height:190px}}
</style></head><body><div class="wrap"><header><div class="logo">NOTA 59</div><div class="label">КОЛЛЕКЦИЯ АРОМАТОВ</div></header><section class="intro"><div class="label">ЗНАКОМСТВО С НИШЕВОЙ ПАРФЮМЕРИЕЙ</div><h1>Найдите свой аромат</h1><p>Любимые композиции и новые открытия.<br>Распив в объёмах 5 и 10 мл.</p></section><div class="filters"><input id="search" type="search" aria-label="Поиск аромата" placeholder="Название, бренд или нота"><select id="brand" aria-label="Бренд"><option value="">Все бренды</option></select></div><p id="status" role="status">Загружаем коллекцию…</p><main id="catalog" class="grid"></main></div><dialog id="dialog" aria-labelledby="title"><div class="detail"><button class="close" id="close">Закрыть</button><div id="photo"></div><p id="maker" class="brand"></p><h2 id="title"></h2><div class="volumes" role="group" aria-label="Объём"><button id="v5" type="button">5 мл</button><button id="v10" type="button">10 мл</button></div><p id="chosen" aria-live="polite"></p><h3>Об аромате</h3><p id="description" class="copy"></p><h3>Ноты</h3><p id="notes" class="copy"></p><a id="order" class="order" target="_blank" rel="noopener noreferrer">Обсудить заказ</a><p class="hint">Наличие и условия покупки уточняются у продавца.</p></div></dialog><script>
'use strict';const $=id=>document.getElementById(id);const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#f7f4ef');tg.setBackgroundColor('#f7f4ef');}catch(e){}}const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽',norm=s=>s.toLowerCase().replaceAll('ё','е');function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}let data,selected;function visual(p){const box=el('div',undefined,'visual'),fallback=()=>box.replaceChildren(el('span',p.brand,'placeholder'));if(p.image){const img=el('img');img.src=p.image;img.alt=p.name;img.loading='lazy';img.onerror=fallback;box.append(img);}else fallback();return box;}function volume(v){$('v5').setAttribute('aria-pressed',String(v===5));$('v10').setAttribute('aria-pressed',String(v===10));$('chosen').textContent=money(v===5?selected.price5:selected.price10);$('order').href='https://t.me/'+encodeURIComponent(data.seller)+'?text='+encodeURIComponent('Здравствуйте! Интересует '+selected.name+', '+v+' мл. Подскажите наличие и условия заказа.');}function openProduct(p){selected=p;$('photo').replaceChildren(visual(p));$('maker').textContent=p.brand;$('title').textContent=p.name;$('description').textContent=p.description;$('notes').textContent=p.notes;volume(5);$('dialog').showModal();$('dialog').scrollTop=0;document.body.classList.add('modal');}function render(){const words=norm($('search').value.trim()).split(/\s+/).filter(Boolean),items=data.items.filter(p=>(!$('brand').value||p.brand===$('brand').value)&&words.every(w=>norm([p.name,p.description,p.notes].join(' ')).includes(w)));$('catalog').replaceChildren();$('status').textContent=items.length?'Ароматов в подборке: '+items.length:'Ничего не найдено. Попробуйте другой запрос.';for(const p of items){const card=el('article',undefined,'card'),info=el('div',undefined,'info'),button=el('button','Подробнее','more');button.type='button';button.setAttribute('aria-label','Подробнее: '+p.name);button.onclick=()=>openProduct(p);info.append(el('p',p.brand,'brand'),el('h2',p.name.startsWith(p.brand+' ')?p.name.slice(p.brand.length+1):p.name),el('p','от '+money(Math.min(p.price5,p.price10)),'price'),button);card.append(visual(p),info);$('catalog').append(card);}}$('close').onclick=()=>$('dialog').close();$('dialog').addEventListener('close',()=>document.body.classList.remove('modal'));$('v5').onclick=()=>volume(5);$('v10').onclick=()=>volume(10);async function init(){try{const r=await fetch('/api/catalog');if(!r.ok)throw Error(r.status);data=await r.json();for(const b of [...new Set(data.items.map(p=>p.brand))].sort()){const o=el('option',b);o.value=b;$('brand').append(o);}$('search').oninput=render;$('brand').onchange=render;render();}catch(e){$('status').textContent='Не удалось загрузить коллекцию. Обновите страницу.';}}init();
</script></body></html>
