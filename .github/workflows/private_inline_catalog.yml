name: Enable compact private catalogue

on:
  push:
    branches: [main]
    paths: ['.github/workflows/private_inline_catalog.yml']

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Connect inline private handlers
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import hashlib
          from pathlib import Path

          path = Path('scent_picker.py')
          raw = path.read_bytes()
          digest = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if digest != 'd574169a1d9f600672e78161ba7700e2bfdc87c8':
              raise RuntimeError('scent_picker.py changed; refusing to overwrite')
          compile(Path('private_catalog.py').read_bytes(), 'private_catalog.py', 'exec')
          tree = ast.parse(raw.decode('utf-8'))
          funcs = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'register']
          if len(funcs) != 1:
              raise RuntimeError('Expected one register function')
          func = funcs[0]
          extra = '    import private_catalog\n    private_catalog.register(application)\n'
          offset = sum(map(len, raw.splitlines(keepends=True)[:func.body[0].lineno - 1]))
          merged = raw[:offset] + extra.encode('utf-8') + raw[offset:]
          compile(merged, 'scent_picker.py', 'exec')
          updated = ast.parse(merged.decode('utf-8'))
          new_func = next(n for n in updated.body if isinstance(n, ast.FunctionDef) and n.name == 'register')
          expected = ast.parse('import private_catalog\nprivate_catalog.register(application)').body
          if [ast.dump(n) for n in new_func.body[:2]] != [ast.dump(n) for n in expected]:
              raise RuntimeError('Registration differs')
          del new_func.body[:2]
          if ast.dump(tree) != ast.dump(updated):
              raise RuntimeError('Existing code changed')
          path.write_bytes(merged)
          print('Validated: new private module syntax OK; early private handlers registered; existing categories and group catalogue unchanged')
          PY
      - name: Commit and push registration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scent_picker.py
          git commit -m 'Enable inline private catalogue without bottom reply keyboard'
          git push origin HEAD:main
