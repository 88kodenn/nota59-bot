name: Repair catalog search
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-search.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair search implementations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html_path = Path('web_catalog.html')
          extra_path = Path('web_new_arrivals.js')
          html = html_path.read_text(encoding='utf-8')
          extra = extra_path.read_text(encoding='utf-8')
          assert '/* nota59-search-v2 */' in html, 'Previous patch not found'
          html, count = re.subn(r'const originalRender = render;.*?(?=search\.setAttribute)', 'window.nota59SearchAliases = aliases;\n            ', html, count=1, flags=re.S)
          assert count == 1, 'Expected wrapper not found'
          old = "norm([p.name,p.description,p.notes].join(' '))"
          new = "norm([p.name,p.brand,p.description,p.notes,(window.nota59SearchAliases || {})[p.name] || ''].join(' '))"
          assert html.count(old) == 1 and extra.count(old) == 1, 'Unexpected search implementation'
          html = html.replace(old, new)
          extra = extra.replace(old, new)
          needle = "search.setAttribute('enterkeyhint', 'search');"
          assert html.count(needle) == 1
          focus = '''
            const revealSearch = () => {
              if (document.activeElement !== search) return;
              search.scrollIntoView({block: 'center', inline: 'nearest', behavior: 'instant'});
            };
            search.addEventListener('focus', () => {
              revealSearch();
              setTimeout(revealSearch, 150);
              setTimeout(revealSearch, 400);
            });
            window.visualViewport?.addEventListener('resize', revealSearch);
          '''
          html = html.replace(needle, needle + focus)
          html = html.replace('/* nota59-search-v2 */', '/* nota59-search-v3 */')
          html_path.write_text(html, encoding='utf-8')
          extra_path.write_text(extra, encoding='utf-8')
          PY
          node --check web_new_arrivals.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html = Path('web_catalog.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', html, flags=re.S)
          for script in scripts:
              if script.strip():
                  subprocess.run(['node', '--check'], input=script, text=True, check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web_catalog.html web_new_arrivals.js
          git commit -m 'fix: unify Russian search and keep input visible'
          git push origin HEAD:main
