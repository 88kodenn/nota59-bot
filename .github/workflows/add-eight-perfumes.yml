name: Add eight perfumes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-eight-perfumes.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extend main catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          import pprint
          p = Path('main.py')
          text = p.read_text(encoding='utf-8')
          tree = ast.parse(text)
          nodes = {t.id: n for n in tree.body if isinstance(n, ast.Assign) for t in n.targets if isinstance(t, ast.Name)}
          catalog = ast.literal_eval(nodes['CATALOG'].value)
          brands = ast.literal_eval(nodes['BRAND_WORDS'].value)
          words = ast.literal_eval(nodes['NAME_WORDS'].value)
          assert len(catalog) == len(words), 'Search aliases mismatch'
          rows = [
              ('Tom Ford Costa Azzurra EDP', 600, 1200,
               'Морской воздух, нагретая солнцем древесина и ароматная зелень побережья. Солоноватые водоросли и плавник встречаются с кардамоном, затем появляются лимон, лаванда, можжевельник и мирт. Ветивер, дуб и смолы придают завершению сухую глубину. Ассоциации — деревянный настил у моря, хвойная тень и прогулка вдоль берега. Это свежесть с древесным характером, а не сладкий пляжный коктейль.\n\nВ СТОРОНУ: унисекс.\n\nКОМУ ПОДОЙДЁТ: любителям морских, зелёных и сухих древесных сочетаний.\nКОГДА НОСИТЬ: днём, весной и летом; на прогулках и в отпуске.\nСТОЙКОСТЬ И ШЛЕЙФ: зависят от кожи, погоды и дозировки; фиксированное время звучания не гарантируется.\nСОВЕТ НОВИЧКУ: начните с 5 мл и оцените солоновато-древесное раскрытие. Это версия Eau de Parfum, не Parfum.',
               'Верх: плавник, водоросли, уд, семена сельдерея, амбретта, кардамон.\nСердце: лимон, лаванда, можжевельник, жёлтый мандарин, полынь, мирт.\nБаза: ветивер, дуб, олибанум, мастиковое дерево, ладан, ваниль.',
               'коста аззурра азура аццурра'),
              ('Tom Ford Ombré Leather EDP', 700, 1400,
               'Мягкая чёрная кожа на фоне сухого воздуха и тёплой древесной глубины. Кардамон открывает композицию пряной прохладой, затем кожаный аккорд становится объёмнее благодаря жасмину самбак. Амбра, мох и пачули добавляют тепла и землистую фактуру. Ассоциации — новая кожаная куртка, дорога через пустыню и вечерний свет. Это выразительная кожаная история без десертной сладости.\n\nВ СТОРОНУ: унисекс.\n\nКОМУ ПОДОЙДЁТ: любителям кожи, сухих специй и тёплой амбровой основы.\nКОГДА НОСИТЬ: вечером и в прохладную погоду; в помещении — с умеренной дозировкой.\nСТОЙКОСТЬ И ШЛЕЙФ: индивидуальны; плотность кожаного аккорда не гарантирует одинаковую проекцию на любой коже.\nСОВЕТ НОВИЧКУ: начните с 5 мл и одного распыления. Это обычная версия EDP, не Ombré Leather Parfum.',
               'Верх: кардамон.\nСердце: кожа, жасмин самбак.\nБаза: амбра, мох, пачули.',
               'омбре омбрэ лезер ледер кожа'),
              ('Tom Ford Neroli Portofino EDP', 1000, 2000,
               'Светлая цитрусовая свежесть в обрамлении белых цветов и ароматных трав. Бергамот, мандарин и лимон дают искристый старт, лаванда и розмарин добавляют зелёную прохладу. В сердце раскрываются нероли, цветок апельсина и жасмин; амбра и амбретта смягчают завершение. Ассоциации — белая рубашка, цитрусовая роща и утро на итальянском побережье. Это прозрачная, чистая свежесть с цветочной глубиной.\n\nВ СТОРОНУ: унисекс.\n\nКОМУ ПОДОЙДЁТ: любителям нероли, цитрусов и свежего одеколонного направления.\nКОГДА НОСИТЬ: днём, весной и летом; на прогулках и в отпуске.\nСТОЙКОСТЬ И ШЛЕЙФ: зависят от условий и кожи; свежий старт и остаточное звучание могут заметно различаться по интенсивности.\nСОВЕТ НОВИЧКУ: начните с 5 мл и оцените белоцветочное раскрытие после цитрусового начала. Это EDP, не Parfum.',
               'Верх: бергамот, мандарин, лимон, горький апельсин, лаванда, розмарин, мирт.\nСердце: цветок апельсина, нероли, жасмин, питтоспорум.\nБаза: амбра, амбретта, дягиль.',
               'нероли портофино'),
              ('Xerjoff Naxos', 900, 1800,
               'Цитрусовая искра постепенно уступает место медовому теплу. Лимон, бергамот и лаванда создают свежий ароматный контраст; ладан добавляет смолистый оттенок. Мёд, корица, жасмин и мягкий кашемировый аккорд делают середину обволакивающей. Табачный лист, ваниль и бобы тонка формируют тёплую сладкую основу. Ассоциации — сицилийский вечер, мёд, ароматный табак и мягкий трикотаж.\n\nВ СТОРОНУ: унисекс.\n\nКОМУ ПОДОЙДЁТ: любителям медово-табачных композиций с лавандой и ванилью.\nКОГДА НОСИТЬ: вечером и в прохладную погоду; в тепле — дозированно.\nСТОЙКОСТЬ И ШЛЕЙФ: индивидуальны и зависят от нанесения; обещать определённое число часов некорректно.\nСОВЕТ НОВИЧКУ: начните с 5 мл и небольшой дозировки — оцените сладость базы в течение дня.',
               'Верх: лимон, бергамот, лаванда, оманский ладан.\nСердце: жасмин самбак, мёд, корица, кашемировое дерево.\nБаза: ваниль, лист табака, бобы тонка.',
               'ксержофф ксерджофф зержофф наксос'),
              ('Emporio Armani Stronger With You Intensely', 550, 1100,
               'Тёплая карамельная история с пряным началом и мягкой замшевой глубиной. Розовый перец, можжевельник и фиалка дают контраст сладкому сердцу из ириски и корицы. Лаванда и шалфей добавляют ароматную свежесть, а ваниль, амбра и бобы тонка собирают композицию в плотный уютный фон. Ассоциации — тёплый свитер, карамельный десерт и вечерняя встреча.\n\nВ СТОРОНУ: мужская по позиционированию; выбор не ограничен полом.\n\nКОМУ ПОДОЙДЁТ: любителям сладких пряных ароматов с ванилью, ириской и мягкой замшей.\nКОГДА НОСИТЬ: вечером, осенью и зимой; для свиданий и уютных встреч.\nСТОЙКОСТЬ И ШЛЕЙФ: индивидуальны; комфортную дозировку лучше определить на коже.\nСОВЕТ НОВИЧКУ: начните с 5 мл и одного-двух распылений. Это Intensely, не исходный Stronger With You и не Absolutely.',
               'Верх: розовый перец, можжевельник, фиалка.\nСердце: ириска, корица, лаванда, шалфей.\nБаза: ваниль, амбра, бобы тонка, замша.',
               'эмпорио армани стронгер виз ю интенсли интенс'),
              ('Dior Sauvage EDT', 550, 1100,
               'Яркий бергамот, перечная свежесть и сухая древесно-амбровая основа. Цитрусовый старт звучит бодро и резко, затем лаванда, герань и пряности добавляют ароматную глубину. Элеми связывает свежесть со смолистыми оттенками, а Ambroxan, кедр и лабданум формируют узнаваемое завершение. Ассоциации — открытый воздух, чистая рубашка и собранный городской образ.\n\nВ СТОРОНУ: мужская по позиционированию; выбор не ограничен полом.\n\nКОМУ ПОДОЙДЁТ: любителям свежих цитрусово-пряных ароматов с сухой древесно-амбровой базой.\nКОГДА НОСИТЬ: днём и вечером, в повседневных делах; для офиса сначала оцените дозировку.\nСТОЙКОСТЬ И ШЛЕЙФ: зависят от кожи и условий; ощущение аромата на себе не всегда совпадает с его заметностью окружающим.\nСОВЕТ НОВИЧКУ: начните с 5 мл. Это туалетная вода EDT, не EDP, Parfum или Elixir.',
               'Верх: калабрийский бергамот, перец.\nСердце: сычуаньский перец, лаванда, розовый перец, ветивер, пачули, герань, элеми.\nБаза: Ambroxan, кедр, лабданум.',
               'диор соваж саваж туалетная вода'),
              ('Maison Margiela Replica By the Fireplace', 600, 1200,
               'Запах воображаемого вечера у камина: тлеющая древесина, жареные каштаны и мягкая ваниль. Гвоздика и розовый перец открывают композицию пряной искрой, цветок апельсина смягчает края. Каштановый аккорд, гваяк и можжевельник создают дымно-древесное сердце. Перуанский бальзам и кашмеран добавляют обволакивающее тепло. Ассоциации — потрескивающие поленья, шерстяной плед и зимний вечер.\n\nВ СТОРОНУ: унисекс.\n\nКОМУ ПОДОЙДЁТ: любителям дымной древесины, каштанов и ванильного тепла.\nКОГДА НОСИТЬ: прохладными вечерами, осенью и зимой.\nСТОЙКОСТЬ И ШЛЕЙФ: индивидуальны; дымные оттенки могут восприниматься по-разному в помещении и на воздухе.\nСОВЕТ НОВИЧКУ: начните с 5 мл и оцените баланс дыма и сладости после раскрытия.',
               'Верх: гвоздика, розовый перец, цветок апельсина.\nСердце: каштан, гваяк, можжевельник.\nБаза: ваниль, перуанский бальзам, кашмеран.',
               'мезон маржела марджела реплика бай зе файрплейс у камина'),
              ('Mancera Tonka Cola', 400, 800,
               'Пряная вишнёвая кола с цитрусовой искрой и тёплым ванильно-смолистым завершением. Корица и мускатный орех встречаются с лимоном и вишней, затем появляется узнаваемый аккорд колы. Пачули и цветок апельсина добавляют глубину и цветочный контраст. Бобы тонка, ваниль, бензоин и лабданум создают мягкую сладкую основу. Ассоциации — вишнёвая газировка, специи и уютный вечер в баре.\n\nВ СТОРОНУ: унисекс.\n\nКОМУ ПОДОЙДЁТ: любителям необычной гурманики, колы, вишни и тёплых специй.\nКОГДА НОСИТЬ: вечером и в прохладную погоду; в жару — особенно умеренно.\nСТОЙКОСТЬ И ШЛЕЙФ: индивидуальны; сладость и насыщенность лучше оценить при небольшой дозировке.\nСОВЕТ НОВИЧКУ: начните с 5 мл и проверьте, нравится ли вам не только аккорд колы, но и ванильно-смолистая база.',
               'Верх: корица, вишня, сицилийский лимон, мускатный орех.\nСердце: кола, индонезийские пачули, цветок апельсина.\nБаза: бобы тонка, ваниль, бензоин, лабданум.',
               'мансера манцера тонка кола'),
          ]
          brands.update({'Xerjoff': 'ксержофф ксерджофф зержофф', 'Emporio Armani': 'эмпорио армани', 'Dior': 'диор', 'Maison Margiela': 'мезон маржела марджела', 'Mancera': 'мансера манцера'})
          existing = {row[0] for row in catalog}
          assert not existing.intersection(row[0] for row in rows), 'Perfume already exists; review required'
          for name, p5, p10, description, notes, aliases in rows:
              catalog.append((name, p5, p10, description, notes, None))
              words.append(aliases)
          assert len(catalog) == len(words)
          assert all(any(row[0].startswith(b + ' ') for b in brands) for row in catalog)
          lines = text.splitlines(keepends=True)
          replacements = {'CATALOG': catalog, 'BRAND_WORDS': brands, 'NAME_WORDS': words}
          for key in sorted(replacements, key=lambda k: nodes[k].lineno, reverse=True):
              node = nodes[key]
              lines[node.lineno-1:node.end_lineno] = [key + ' = ' + pprint.pformat(replacements[key], width=120, sort_dicts=False) + '\n']
          output = ''.join(lines)
          compile(output, 'main.py', 'exec')
          p.write_text(output, encoding='utf-8')
          PY
          python -m py_compile main.py app.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- main.py
          git commit -m 'feat: add eight perfumes with descriptions pyramids and prices'
          git push origin HEAD:main
